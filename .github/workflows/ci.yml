name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: smart-bookmark-app/package-lock.json
        
    - name: Install Dependencies
      run: |
        cd smart-bookmark-app
        npm ci
        
    - name: Run Lint
      run: |
        cd smart-bookmark-app
        npm run lint
        
    - name: Build
      run: |
        cd smart-bookmark-app
        npm run build
